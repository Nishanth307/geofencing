# Air configuration for live-reload development
root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/main ./cmd/app/main.go"
bin = "./tmp/main"
include_ext = ["go", "sql"]
exclude_dir = ["assets", "tmp", "vendor", "test"]
delay = 1000
stop_on_error = true
log = "air.log"

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]
clean_on_exit = true
